{% extends "base.html" %}

{% block title %}404 Page Not Found - AI Interview Prep{% endblock %}

{% block content %}
<div class="glass-panel" style="max-width: 600px; margin: 40px auto; padding: 48px 32px; text-align: center;">
    <div style="font-size: 4rem; color: var(--accent-amber); margin-bottom: 16px;">
        <i class="fa-solid fa-triangle-exclamation"></i> 404
    </div>
    <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 12px;">Page Not Found</h2>
    <p style="color: var(--text-muted); margin-bottom: 28px;">
        The requested page does not exist or has been moved.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
        <i class="fa-solid fa-house"></i> Return to Homepage
    </a>
</div>
{% endblock %}
