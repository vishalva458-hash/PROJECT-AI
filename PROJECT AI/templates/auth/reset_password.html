{% extends "base.html" %}

{% block title %}Reset Password - AI Interview Prep{% endblock %}

{% block content %}
<div class="glass-panel auth-box">
    <h2 style="text-align: center; margin-bottom: 8px; font-size: 1.8rem;">Reset Password</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 28px; font-size: 0.95rem;">Enter your registered account email and set a new password</p>

    <form action="{{ url_for('reset_password') }}" method="POST">
        <div class="form-group">
            <label for="email" class="form-label">Registered Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
        </div>

        <div class="form-group">
            <label for="new_password" class="form-label">New Password</label>
            <input type="password" id="new_password" name="new_password" class="form-control" placeholder="••••••••" required minlength="6">
        </div>

        <div class="form-group">
            <label for="confirm_password" class="form-label">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">
            <i class="fa-solid fa-key"></i> Update Password & Sign In
        </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Remembered your password? <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in here</a>
    </div>
</div>
{% endblock %}
