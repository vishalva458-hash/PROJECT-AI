{% extends "base.html" %}

{% block title %}Login - AI Interview Prep{% endblock %}

{% block content %}
<div class="glass-panel auth-box">
    <h2 style="text-align: center; margin-bottom: 8px; font-size: 1.8rem;">Welcome Back</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 28px; font-size: 0.95rem;">Sign in to your AI interview prep account</p>

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
        </div>

        <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
                <a href="{{ url_for('reset_password') }}" style="color: var(--primary); font-size: 0.85rem; text-decoration: none;">Forgot Password?</a>
            </div>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 8px;">
        <div>Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register here</a></div>
    </div>
</div>
{% endblock %}
